name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste what the command printed. If it's about one file's metadata, `exiftool -G -a <file>` helps too (remove anything private).
      render: text
  - type: input
    id: version
    attributes:
      label: clean-assets-meta version (`clean-assets-meta --version`)
      placeholder: "1.0.0"
  - type: input
    id: exiftool-version
    attributes:
      label: exiftool version (`exiftool -ver`)
      placeholder: "13.10"
  - type: input
    id: node-version
    attributes:
      label: Node version (`node --version`)
      placeholder: "24.11.0"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1"
