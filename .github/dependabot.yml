version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Types must match the oldest supported Node (engines.node), not the latest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
